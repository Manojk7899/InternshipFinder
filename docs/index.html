<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Internship Radar</title>
<style>
:root{--bg:#f7f8fa;--card:#fff;--ink:#15181d;--muted:#6b7280;--line:#e4e7ec;--accent:#1f6feb;--new:#0a7c3f;--newbg:#e6f6ec;--chip:#eef1f5}
@media (prefers-color-scheme:dark){:root{--bg:#0e1116;--card:#161b22;--ink:#e6edf3;--muted:#9198a1;--line:#2a313c;--accent:#4a9eff;--new:#56d364;--newbg:#12331f;--chip:#21262d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:0 16px 48px}.wrap{max-width:900px;margin:0 auto}header{padding:28px 0 16px}h1{margin:0 0 4px;font-size:24px}.sub{color:var(--muted);font-size:13px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}button{font:inherit;padding:7px 13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;cursor:pointer}button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}.job{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}.job h2{margin:0;font-size:16px}.job h2 a{color:var(--ink);text-decoration:none}.job h2 a:hover{color:var(--accent);text-decoration:underline}.meta{color:var(--muted);font-size:13px;margin-top:3px}.tags{margin-top:9px;display:flex;gap:6px;flex-wrap:wrap}.tag{background:var(--chip);color:var(--muted);font-size:11px;padding:3px 8px;border-radius:5px}.new{background:var(--newbg);color:var(--new);font-weight:600}.score{float:right;color:var(--muted);font-size:12px}.empty{color:var(--muted);padding:40px;text-align:center}
</style>
</head>
<body><div class="wrap">
<header><h1>🎓 Internship Radar</h1><div class="sub" id="sub">Loading…</div><div class="sub" style="margin-top:6px">Rust · HTML · CSS · JavaScript · Fresher internships</div></header>
<div class="bar" id="windows"><button data-win="0">Today</button><button data-win="2" aria-pressed="true">Last 3 days</button><button data-win="6">Last week</button><button data-win="all">All open</button></div>
<div class="bar" id="toggles"><button data-tog="bangalore">Bangalore</button><button data-tog="fresher" aria-pressed="true">Fresher-friendly</button></div><div id="list"></div></div>
<script>
let JOBS=[],windowDays=2,toggles={bangalore:false,fresher:true};
const el=id=>document.getElementById(id);
function age(j){const d=Date.parse((j.firstSeen||'')+'T00:00:00Z');return isNaN(d)?0:Math.max(0,Math.floor((Date.now()-d)/86400000))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const rows=JOBS.filter(j=>(windowDays===null||age(j)<=windowDays)&&(!toggles.bangalore||j.bangalore)&&(!toggles.fresher||j.fresher));el('list').innerHTML=rows.length?rows.map(j=>`<div class="job"><span class="score">${j.score}</span><h2><a href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a></h2><div class="meta">${esc(j.company)} · ${esc(j.location||'India')}</div><div class="tags">${age(j)===0?' <span class="tag new">NEW</span>':age(j)<=6?`<span class="tag">${age(j)}d ago</span>`:''}${j.fresher?' <span class="tag">fresher</span>':''}${j.years?` <span class="tag">${j.years}y exp</span>`:''}${(j.skills||[]).map(s=>`<span class="tag">${esc(s)}</span>`).join('')}</div></div>`).join(''):'<div class="empty">Nothing matches these filters.</div>'}
for(const b of document.querySelectorAll('#windows button'))b.onclick=()=>{const v=b.dataset.win;windowDays=v==='all'?null:Number(v);for(const o of document.querySelectorAll('#windows button'))o.setAttribute('aria-pressed',String(o===b));render()};
for(const b of document.querySelectorAll('#toggles button'))b.onclick=()=>{const k=b.dataset.tog;toggles[k]=!toggles[k];b.setAttribute('aria-pressed',String(toggles[k]));render()};
fetch('jobs.json?t='+Date.now()).then(r=>r.json()).then(d=>{JOBS=d.jobs;const n=JOBS.filter(j=>age(j)===0).length,w=JOBS.filter(j=>age(j)<=6).length;el('sub').textContent=`${d.count} open internships · ${n} new today · ${w} this week · updated ${new Date(d.updated).toLocaleString('en-IN')}`;render()}).catch(()=>el('sub').textContent='Could not load jobs.json');
</script></body></html>
