<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Radar</title>
<style>
  :root{
    --bg:#f7f8fa; --card:#fff; --ink:#15181d; --muted:#6b7280; --line:#e4e7ec;
    --accent:#1f6feb; --new:#0a7c3f; --newbg:#e6f6ec; --chip:#eef1f5;
  }
  :root:not([data-theme="light"]){ @media (prefers-color-scheme: dark){
    --bg:#0e1116; --card:#161b22; --ink:#e6edf3; --muted:#9198a1; --line:#2a313c;
    --accent:#4a9eff; --new:#56d364; --newbg:#12331f; --chip:#21262d;
  }}
  :root[data-theme="dark"]{
    --bg:#0e1116; --card:#161b22; --ink:#e6edf3; --muted:#9198a1; --line:#2a313c;
    --accent:#4a9eff; --new:#56d364; --newbg:#12331f; --chip:#21262d;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:0 16px 48px}
  .wrap{max-width:900px;margin:0 auto}
  header{padding:28px 0 16px}
  h1{margin:0 0 4px;font-size:24px;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:13px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
  button{font:inherit;padding:7px 13px;border:1px solid var(--line);background:var(--card);
    color:var(--ink);border-radius:999px;cursor:pointer}
  button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .job{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;margin-bottom:10px}
  .job h2{margin:0;font-size:16px;font-weight:600}
  .job h2 a{color:var(--ink);text-decoration:none}
  .job h2 a:hover{color:var(--accent);text-decoration:underline}
  .meta{color:var(--muted);font-size:13px;margin-top:3px}
  .tags{margin-top:9px;display:flex;gap:6px;flex-wrap:wrap}
  .tag{background:var(--chip);color:var(--muted);font-size:11px;padding:3px 8px;border-radius:5px}
  .new{background:var(--newbg);color:var(--new);font-weight:600}
  .score{float:right;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
  .empty{color:var(--muted);padding:40px 0;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Job Radar</h1>
    <div class="sub" id="sub">Loading…</div>
  </header>
  <div class="bar">
    <button id="f-all"  aria-pressed="true">All</button>
    <button id="f-new"  aria-pressed="false">New today</button>
    <button id="f-blr"  aria-pressed="false">Bangalore</button>
    <button id="f-fresh" aria-pressed="false">Fresher-friendly</button>
  </div>
  <div id="list"></div>
</div>
<script>
let JOBS = [], filter = 'all';
const el = id => document.getElementById(id);

function render(){
  const f = {
    all:   j => true,
    new:   j => j.isNew,
    blr:   j => j.bangalore,
    fresh: j => j.fresher,
  }[filter];
  const rows = JOBS.filter(f);
  el('list').innerHTML = rows.length ? rows.map(j => `
    <div class="job">
      <span class="score">${j.score}</span>
      <h2><a href="${j.url}" target="_blank" rel="noopener">${esc(j.title)}</a></h2>
      <div class="meta">${esc(j.company)} &middot; ${esc(j.location || 'India')}</div>
      <div class="tags">
        ${j.isNew ? '<span class="tag new">NEW</span>' : ''}
        ${j.fresher ? '<span class="tag">fresher</span>' : ''}
        ${j.years ? `<span class="tag">${j.years}y exp</span>` : ''}
        ${(j.skills||[]).map(s => `<span class="tag">${esc(s)}</span>`).join('')}
      </div>
    </div>`).join('') : '<div class="empty">Nothing matches this filter today.</div>';
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

for (const k of ['all','new','blr','fresh']) {
  el('f-'+k).onclick = () => {
    filter = k;
    for (const o of ['all','new','blr','fresh'])
      el('f-'+o).setAttribute('aria-pressed', String(o===k));
    render();
  };
}

fetch('jobs.json?t=' + Date.now())
  .then(r => r.json())
  .then(d => {
    JOBS = d.jobs;
    const n = JOBS.filter(j => j.isNew).length;
    el('sub').textContent =
      `${d.count} open roles · ${n} new today · updated ${new Date(d.updated).toLocaleString('en-IN')}`;
    render();
  })
  .catch(() => el('sub').textContent = 'Could not load jobs.json');
</script>
</body>
</html>
