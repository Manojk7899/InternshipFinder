name: Job Radar

on:
  schedule:
    - cron: '30 1 * * *'   # 07:00 IST daily
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scan job boards
        run: python radar.py

      - name: Commit results
        run: |
          git config user.name  "job-radar"
          git config user.email "actions@github.com"
          git add docs/jobs.json docs/seen.json
          git diff --staged --quiet || git commit -m "radar: $(date -u +%Y-%m-%d) results"
          git push
